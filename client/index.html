<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e14" />
    <title>Live Chat App (XSS Demo)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
  </head>

  <body>
    <div class="step-signup" style="display: none">
      <h1>Group Chat (XSS)</h1>
      <h4>Create an account</h4>
      <div class="input-container">
        <div>
          <input
            type="text"
            id="signup-name"
            placeholder="Full Name"
            required
            class="input-username"
          />
        </div>
        <div>
          <input
            type="text"
            id="signup-username"
            placeholder="Username"
            required
            class="input-username"
          />
        </div>
        <div>
          <input
            type="password"
            id="signup-password"
            placeholder="Password"
            required
            class="input-username"
          />
        </div>
        <div>
          <input
            type="password"
            id="signup-password-confirm"
            placeholder="Repeat Password"
            required
            class="input-username"
          />
        </div>
        <div class="login-error" id="signup-error"></div>
        <div>
          <button class="continue-btn" id="signup-submit">Sign Up</button>
        </div>
        <p class="auth-switch">
          Already have an account? <a href="#" id="show-login">Login</a>
        </p>
      </div>
    </div>

    <div class="step-login" style="display: none">
      <h1>Group Chat (XSS)</h1>
      <h4>Login to continue</h4>
      <div class="input-container">
        <div>
          <input
            type="text"
            id="login-username"
            placeholder="Username"
            required
            class="input-username"
          />
        </div>
        <div>
          <input
            type="password"
            id="login-password"
            placeholder="Password"
            required
            class="input-username"
          />
        </div>
        <div class="login-error" id="login-error"></div>
        <div>
          <button class="continue-btn" id="login-submit">Login</button>
        </div>
        <p class="auth-switch">
          Don't have an account? <a href="#" id="show-signup">Sign Up</a>
        </p>
      </div>
    </div>
    <div class="step2">
      <div class="chat-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <h2 class="sidebar-title">Chats</h2>
            <button class="new-group-btn" id="new-group-btn" title="New Group">
              +
            </button>
          </div>
          <div class="sidebar-list" id="sidebar-list">
            <!-- Populated by JS -->
          </div>
        </aside>

        <!-- Chat area -->
        <div class="chat-area">
          <div class="top-bar">
            <button class="hamburger-btn" id="hamburger-btn">☰</button>
            <h1
              id="chat-title"
              class="chat-title-clickable"
              title="View details"
            >
              Community
            </h1>
            <div class="top-bar-right">
              <button class="logout-btn" id="logout-btn">Logout</button>
              <div class="logged-in-user" id="logged-in-user"></div>
            </div>
          </div>

          <div id="messages"></div>

          <form id="chat-form">
            <div
              class="image-preview-bar"
              id="image-preview-bar"
              style="display: none"
            >
              <img id="image-preview-img" src="" alt="Preview" />
              <button
                type="button"
                class="image-preview-remove"
                id="image-preview-remove"
                title="Remove"
              >
                ✕
              </button>
            </div>
            <div class="send-message-wrapper">
              <button
                type="button"
                class="emoji-toggle-btn"
                id="emoji-toggle-btn"
                title="Emoji"
              >
                😊
              </button>
              <div class="emoji-picker" id="emoji-picker" style="display: none">
                <div class="emoji-grid" id="emoji-grid"></div>
              </div>
              <button
                type="button"
                class="attach-btn"
                id="attach-btn"
                title="Attach image"
              >
                📎
              </button>
              <input
                type="file"
                id="image-input"
                accept="image/jpeg,image/png,image/gif,image/webp"
                style="display: none"
              />
              <textarea
                id="message"
                placeholder="Type your message"
                rows="1"
              ></textarea>
              <button type="submit" class="submit-btn" title="Send">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
                  <path
                    d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"
                    fill="currentColor"
                  />
                </svg>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Sidebar overlay backdrop (mobile) -->
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <!-- Group creation modal -->
      <div class="modal-backdrop" id="modal-backdrop" style="display: none">
        <div class="modal">
          <h3>Create Group</h3>
          <input
            type="text"
            id="group-name-input"
            placeholder="Group name"
            class="input-username"
          />
          <div class="modal-members-label">Select members:</div>
          <div class="modal-members-list" id="modal-members-list"></div>
          <div class="login-error" id="group-error"></div>
          <div class="modal-actions">
            <button type="button" class="modal-cancel-btn" id="modal-cancel">
              Cancel
            </button>
            <button type="button" class="modal-create-btn" id="modal-create">
              Create
            </button>
          </div>
        </div>
      </div>

      <!-- Conversation info modal -->
      <div
        class="modal-backdrop"
        id="info-modal-backdrop"
        style="display: none"
      >
        <div class="modal">
          <h3 id="info-modal-title">Details</h3>
          <div class="modal-members-label">Members:</div>
          <div class="modal-members-list" id="info-modal-members"></div>
          <div class="modal-actions">
            <button
              type="button"
              class="modal-cancel-btn"
              id="info-modal-close"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // State
      window.currentConversationId = 1; // Default: Community
      window.socket = null;
      window.allUsers = [];

      function formatMsgTime(ts) {
        if (!ts) return "";
        const d = new Date(ts.endsWith("Z") ? ts : ts + "Z");
        const now = new Date();
        const isToday = d.toDateString() === now.toDateString();
        const time = d.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
        if (isToday) return time;
        return (
          d.toLocaleDateString([], { month: "short", day: "numeric" }) +
          ", " +
          time
        );
      }

      function renderMessage(msg, container) {
        const msgElement = document.createElement("div");
        msgElement.classList.add("message");
        if (msg.username === window.username) {
          msgElement.classList.add("self-message");
        } else {
          msgElement.classList.add("group-message");
        }
        const ts = formatMsgTime(msg.timestamp);
        let contentHtml = "";
        if (msg.image_url) {
          contentHtml += `<div class="msg-image"><img src="${msg.image_url}" alt="image" loading="lazy" onclick="window.open('${msg.image_url}','_blank')" /></div>`;
        }
        if (msg.message) {
          contentHtml += `<div>${msg.message}</div>`;
        }
        msgElement.innerHTML = `<div class="msg-user">${msg.username[0]}</div> <div class="msg-msg"><div class="msg-username">${msg.username}</div>${contentHtml}<div class="msg-time">${ts}</div></div>`;
        container.appendChild(msgElement);
      }

      function showEmptyState(container) {
        container.innerHTML =
          '<div class="empty-chat-state"><div class="empty-chat-icon">💬</div><div class="empty-chat-text">No messages yet</div><div class="empty-chat-subtext">Say hello to start the conversation!</div></div>';
      }

      function showStep(step) {
        document.querySelector(".step-signup").style.display =
          step === "signup" ? "" : "none";
        document.querySelector(".step-login").style.display =
          step === "login" ? "" : "none";
        document.querySelector(".step2").style.display =
          step === "chat" ? "flex" : "none";
      }

      // Toggle between signup and login
      document
        .getElementById("show-login")
        .addEventListener("click", function (e) {
          e.preventDefault();
          showStep("login");
        });
      document
        .getElementById("show-signup")
        .addEventListener("click", function (e) {
          e.preventDefault();
          showStep("signup");
        });

      // Render sidebar conversation list
      function renderSidebar(conversations, users) {
        const list = document.getElementById("sidebar-list");
        list.innerHTML = "";

        // Conversations with messages (already sorted by timestamp from API)
        const withMessages = conversations.filter((c) => c.last_message_at);
        const withoutMessages = conversations.filter((c) => !c.last_message_at);

        // Users who don't have a private conversation yet
        const usersInPrivateChats = new Set();
        conversations.forEach((c) => {
          if (c.type === "private" && c.other_user) {
            usersInPrivateChats.add(c.other_user.username);
          }
        });
        const remainingUsers = users.filter(
          (u) =>
            u.username !== window.username &&
            !usersInPrivateChats.has(u.username),
        );

        function createConvItem(conv) {
          const item = document.createElement("div");
          item.classList.add("sidebar-item");
          if (conv.id === window.currentConversationId)
            item.classList.add("active");

          let displayName = conv.name || "Chat";
          let initial = displayName[0];
          if (conv.type === "private" && conv.other_user) {
            displayName = conv.other_user.name || conv.other_user.username;
            initial = displayName[0];
          }

          const lastMsg = conv.last_message
            ? conv.last_message.substring(0, 30) +
              (conv.last_message.length > 30 ? "…" : "")
            : "";
          const time = conv.last_message_at
            ? new Date(conv.last_message_at + "Z").toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",
              })
            : "";

          item.innerHTML = `
            <div class="sidebar-avatar ${conv.type === "group" ? "group-avatar" : ""}">${initial}</div>
            <div class="sidebar-info">
              <div class="sidebar-name">${displayName}</div>
              <div class="sidebar-preview">${lastMsg}</div>
            </div>
            <div class="sidebar-meta">
              ${time ? '<div class="sidebar-time">' + time + "</div>" : ""}
              ${conv.unread_count > 0 ? '<div class="unread-badge">' + conv.unread_count + "</div>" : ""}
            </div>
          `;

          item.addEventListener("click", () => {
            switchConversation(conv.id, displayName);
            closeSidebarMobile();
          });
          return item;
        }

        function createUserItem(user) {
          const item = document.createElement("div");
          item.classList.add("sidebar-item", "sidebar-user-item");
          item.innerHTML = `
            <div class="sidebar-avatar">${(user.name || user.username)[0]}</div>
            <div class="sidebar-info">
              <div class="sidebar-name">${user.name || user.username}</div>
              <div class="sidebar-preview" style="color:var(--text-muted)">Start a conversation</div>
            </div>
          `;
          item.addEventListener("click", () => {
            startPrivateChat(user.username, user.name || user.username);
            closeSidebarMobile();
          });
          return item;
        }

        // Render conversations with messages first
        withMessages.forEach((c) => list.appendChild(createConvItem(c)));
        // Then conversations without messages
        withoutMessages.forEach((c) => list.appendChild(createConvItem(c)));
        // Then remaining users
        if (remainingUsers.length > 0) {
          const divider = document.createElement("div");
          divider.classList.add("sidebar-divider");
          divider.textContent = "All Users";
          list.appendChild(divider);
          remainingUsers.forEach((u) => list.appendChild(createUserItem(u)));
        }
      }

      // Fetch and render sidebar
      function refreshSidebar() {
        Promise.all([
          fetch("/api/conversations").then((r) => r.json()),
          fetch("/api/users").then((r) => r.json()),
        ]).then(([conversations, users]) => {
          window.allUsers = users;
          renderSidebar(conversations, users);
        });
      }

      // Switch to a conversation
      function switchConversation(convId, displayName) {
        window.currentConversationId = convId;
        document.getElementById("chat-title").textContent = displayName;
        document.getElementById("messages").innerHTML = "";
        window.socket.emit("load messages", convId);

        // Mark conversation as read
        fetch("/api/conversations/" + convId + "/read", {
          method: "POST",
        }).then(() => refreshSidebar());
      }

      // Start a private chat with a user
      function startPrivateChat(otherUsername, displayName) {
        fetch("/api/conversations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "private", members: [otherUsername] }),
        })
          .then((r) => r.json())
          .then((data) => {
            window.socket.emit("join conversation", data.id);
            switchConversation(data.id, displayName);
          });
      }

      // Connect to Socket.IO server
      function initSocket() {
        const socket = io();
        window.socket = socket;

        // Join all conversation rooms
        socket.emit("join conversations", window.username);

        // Load Community messages by default
        socket.emit("load messages", window.currentConversationId);

        socket.on("chat messages", (data) => {
          if (data.conversationId !== window.currentConversationId) return;
          const messagesContainer = document.getElementById("messages");
          messagesContainer.innerHTML = "";
          if (data.messages.length === 0) {
            showEmptyState(messagesContainer);
          } else {
            data.messages.forEach((msg) =>
              renderMessage(msg, messagesContainer),
            );
          }
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });

        socket.on("new message", (msg) => {
          refreshSidebar();

          if (msg.conversationId !== window.currentConversationId) return;

          // Mark as read since we're viewing this conversation
          fetch("/api/conversations/" + msg.conversationId + "/read", {
            method: "POST",
          });

          const messagesContainer = document.getElementById("messages");
          // Clear empty state if present
          const emptyState =
            messagesContainer.querySelector(".empty-chat-state");
          if (emptyState) emptyState.remove();

          renderMessage(msg, messagesContainer);
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });

        socket.on("conversation updated", () => {
          refreshSidebar();
        });

        document
          .getElementById("chat-form")
          .addEventListener("submit", function (e) {
            e.preventDefault();
            const username = window.username;
            const message = document.getElementById("message").value;
            const imageInput = document.getElementById("image-input");
            const pendingFile = imageInput.files[0];

            if (pendingFile) {
              const formData = new FormData();
              formData.append("image", pendingFile);
              formData.append("conversationId", window.currentConversationId);
              formData.append("username", username);
              formData.append("message", message);
              fetch("/api/upload", { method: "POST", body: formData })
                .then((r) => r.json())
                .then((data) => {
                  if (data.error) alert(data.error);
                })
                .catch((err) => console.error("Upload failed:", err));
              // Clear image preview
              imageInput.value = "";
              document.getElementById("image-preview-bar").style.display =
                "none";
            } else if (message.trim()) {
              socket.emit("new message", {
                username,
                message,
                conversationId: window.currentConversationId,
              });
            }
            document.getElementById("message").value = "";
          });

        // Attachment button
        document
          .getElementById("attach-btn")
          .addEventListener("click", function () {
            document.getElementById("image-input").click();
          });
        document
          .getElementById("image-input")
          .addEventListener("change", function () {
            const file = this.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
              alert("Image too large. Maximum size is 5MB.");
              this.value = "";
              return;
            }
            const reader = new FileReader();
            reader.onload = function (ev) {
              document.getElementById("image-preview-img").src =
                ev.target.result;
              document.getElementById("image-preview-bar").style.display =
                "flex";
            };
            reader.readAsDataURL(file);
          });
        document
          .getElementById("image-preview-remove")
          .addEventListener("click", function () {
            document.getElementById("image-input").value = "";
            document.getElementById("image-preview-bar").style.display = "none";
          });
      }

      function enterChat(username) {
        window.username = username;
        window.currentConversationId = 1;
        sessionStorage.setItem("username", username);
        document.getElementById("logged-in-user").textContent = username;
        document.getElementById("chat-title").textContent = "Community";
        showStep("chat");
        initSocket();
        refreshSidebar();
      }

      // Logout
      document
        .getElementById("logout-btn")
        .addEventListener("click", function () {
          fetch("/logout", { method: "POST" })
            .then(() => {
              window.username = null;
              sessionStorage.removeItem("username");
              document.getElementById("messages").innerHTML = "";
              if (window.socket) window.socket.disconnect();
              window.socket = null;
              showStep("login");
            })
            .catch((err) => console.error("Logout failed:", err));
        });

      // Signup
      document
        .getElementById("signup-submit")
        .addEventListener("click", function () {
          const name = document.getElementById("signup-name").value;
          const username = document.getElementById("signup-username").value;
          const password = document.getElementById("signup-password").value;
          const confirmPassword = document.getElementById(
            "signup-password-confirm",
          ).value;
          const errorEl = document.getElementById("signup-error");
          errorEl.textContent = "";

          if (!name || !username || !password || !confirmPassword) {
            errorEl.textContent = "All fields are required";
            return;
          }
          if (password !== confirmPassword) {
            errorEl.textContent = "Passwords do not match";
            return;
          }

          fetch("/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, username, password }),
          })
            .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
            .then(({ ok, data }) => {
              if (!ok) {
                errorEl.textContent = data.error;
                return;
              }
              showStep("login");
            })
            .catch((err) => {
              errorEl.textContent = "Signup failed";
              console.error("Signup failed:", err);
            });
        });

      // Login
      document
        .getElementById("login-submit")
        .addEventListener("click", function () {
          const username = document.getElementById("login-username").value;
          const password = document.getElementById("login-password").value;
          const errorEl = document.getElementById("login-error");
          errorEl.textContent = "";

          if (!username || !password) {
            errorEl.textContent = "Please enter username and password";
            return;
          }

          fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          })
            .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
            .then(({ ok, data }) => {
              if (!ok) {
                errorEl.textContent = data.error;
                return;
              }
              enterChat(username);
            })
            .catch((err) => {
              errorEl.textContent = "Login failed";
              console.error("Login failed:", err);
            });
        });

      // Mobile hamburger toggle
      document.getElementById("hamburger-btn").addEventListener("click", () => {
        document.getElementById("sidebar").classList.toggle("open");
        document.getElementById("sidebar-backdrop").classList.toggle("open");
      });
      document
        .getElementById("sidebar-backdrop")
        .addEventListener("click", closeSidebarMobile);

      function closeSidebarMobile() {
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("sidebar-backdrop").classList.remove("open");
      }

      // Chat title click — show conversation info/members
      document.getElementById("chat-title").addEventListener("click", () => {
        const convId = window.currentConversationId;
        fetch("/api/conversations/" + convId + "/members")
          .then((r) => r.json())
          .then((data) => {
            const title =
              data.conversation.name ||
              document.getElementById("chat-title").textContent;
            document.getElementById("info-modal-title").textContent = title;
            const list = document.getElementById("info-modal-members");
            list.innerHTML = "";
            data.members.forEach((m) => {
              const item = document.createElement("div");
              item.classList.add("modal-member-item");
              const isYou = m.username === window.username;
              item.innerHTML = `<div class="sidebar-avatar" style="width:32px;height:32px;min-width:32px;font-size:14px;">${(m.name || m.username)[0]}</div> <span>${m.name || m.username}${isYou ? " (You)" : ""}</span>`;
              list.appendChild(item);
            });
            document.getElementById("info-modal-backdrop").style.display =
              "flex";
          });
      });

      document
        .getElementById("info-modal-close")
        .addEventListener("click", () => {
          document.getElementById("info-modal-backdrop").style.display = "none";
        });

      // Group creation modal
      document.getElementById("new-group-btn").addEventListener("click", () => {
        const membersList = document.getElementById("modal-members-list");
        membersList.innerHTML = "";
        document.getElementById("group-name-input").value = "";
        document.getElementById("group-error").textContent = "";

        window.allUsers
          .filter((u) => u.username !== window.username)
          .forEach((u) => {
            const label = document.createElement("label");
            label.classList.add("modal-member-item");
            label.innerHTML = `<input type="checkbox" value="${u.username}" /> <span>${u.name || u.username}</span>`;
            membersList.appendChild(label);
          });

        document.getElementById("modal-backdrop").style.display = "flex";
      });

      document.getElementById("modal-cancel").addEventListener("click", () => {
        document.getElementById("modal-backdrop").style.display = "none";
      });

      document.getElementById("modal-create").addEventListener("click", () => {
        const name = document.getElementById("group-name-input").value.trim();
        const errorEl = document.getElementById("group-error");
        errorEl.textContent = "";

        const checked = document.querySelectorAll(
          "#modal-members-list input:checked",
        );
        const members = Array.from(checked).map((cb) => cb.value);

        if (!name) {
          errorEl.textContent = "Group name is required";
          return;
        }
        if (members.length === 0) {
          errorEl.textContent = "Select at least one member";
          return;
        }

        fetch("/api/conversations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "group", name, members }),
        })
          .then((r) => r.json())
          .then((data) => {
            document.getElementById("modal-backdrop").style.display = "none";
            window.socket.emit("join conversation", data.id);
            switchConversation(data.id, name);
          })
          .catch(() => {
            errorEl.textContent = "Failed to create group";
          });
      });

      // Enter to send, Shift+Enter for new line
      document
        .getElementById("message")
        .addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            document
              .getElementById("chat-form")
              .dispatchEvent(new Event("submit"));
          }
        });

      // Emoji picker
      const emojis = [
        "😊",
        "😂",
        "❤️",
        "🔥",
        "👍",
        "😭",
        "🎉",
        "💀",
        "👀",
        "🤔",
        "😎",
        "🙏",
        "💯",
        "✨",
        "😈",
        "🤡",
        "💚",
        "🫡",
        "👏",
        "😤",
        "🥳",
        "😱",
        "💀",
        "🤖",
        "👾",
        "🐛",
        "⚡",
        "🔒",
        "🛡️",
        "💻",
        "🧑‍💻",
        "🪲",
      ];
      const emojiGrid = document.getElementById("emoji-grid");
      emojis.forEach((emoji) => {
        const btn = document.createElement("span");
        btn.classList.add("emoji-item");
        btn.textContent = emoji;
        btn.addEventListener("click", () => {
          const ta = document.getElementById("message");
          const start = ta.selectionStart;
          const end = ta.selectionEnd;
          ta.value =
            ta.value.substring(0, start) + emoji + ta.value.substring(end);
          ta.selectionStart = ta.selectionEnd = start + emoji.length;
          ta.focus();
        });
        emojiGrid.appendChild(btn);
      });

      document
        .getElementById("emoji-toggle-btn")
        .addEventListener("click", (e) => {
          e.stopPropagation();
          const picker = document.getElementById("emoji-picker");
          picker.style.display =
            picker.style.display === "none" ? "block" : "none";
        });

      document.addEventListener("click", (e) => {
        const picker = document.getElementById("emoji-picker");
        if (
          picker &&
          !picker.contains(e.target) &&
          e.target.id !== "emoji-toggle-btn"
        ) {
          picker.style.display = "none";
        }
      });

      // Auto-login if session exists
      fetch("/me")
        .then((res) => {
          if (res.ok) return res.json();
          throw new Error("Not logged in");
        })
        .then((data) => enterChat(data.username))
        .catch(() => {
          showStep("signup");
        });
    </script>
  </body>
</html>
